name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# タグの実行で Release にファイルを添付するため、リポジトリへの書き込みを許可する
# (新しいリポジトリでは GITHUB_TOKEN が既定で読み取り専用のため、これが無いと Release の手順で失敗する)
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 binutils-mingw-w64-i686 libz-mingw-w64-dev make zip
          i686-w64-mingw32-gcc --version
      - name: Build
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: MKWrap
          path: dist/*.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
